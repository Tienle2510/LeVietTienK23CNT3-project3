<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh mục sản phẩm | OnlyCoffee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #f8f9fa; }
        .section-title {
            color: #6f4e37;
            font-weight: bold;
            text-align: center;
            margin-bottom: 40px;
        }
        .category-card {
            background: white;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,.1);
            transition: transform .3s;
            height: 100%;
        }
        .category-card:hover {
            transform: translateY(-8px);
        }
        .category-icon {
            font-size: 3rem;
            color: #6f4e37;
            margin-bottom: 15px;
        }
        .btn-coffee {
            background-color: #6f4e37;
            color: #fff;
        }
        .btn-coffee:hover {
            background-color: #5a3d2b;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <h2 class="section-title">DANH MỤC SẢN PHẨM</h2>

    <div class="row">
        <div class="col-md-3 col-sm-6 mb-4">
            <div class="category-card">
                <div class="category-icon">
                    <i class="fas fa-seedling"></i>
                </div>
                <h5>Cà phê hạt</h5>
                <p class="text-muted small">Hạt cà phê nguyên chất tuyển chọn</p>
            </div>
        </div>

        <div class="col-md-3 col-sm-6 mb-4">
            <div class="category-card">
                <div class="category-icon">
                    <i class="fas fa-mortar-pestle"></i>
                </div>
                <h5>Cà phê xay</h5>
                <p class="text-muted small">Xay sẵn tiện lợi cho pha chế</p>
            </div>
        </div>

        <div class="col-md-3 col-sm-6 mb-4">
            <div class="category-card">
                <div class="category-icon">
                    <i class="fas fa-crown"></i>
                </div>
                <h5>Cà phê đặc sản</h5>
                <p class="text-muted small">Đặc sản vùng miền cao cấp</p>
            </div>
        </div>

        <div class="col-md-3 col-sm-6 mb-4">
            <div class="category-card">
                <div class="category-icon">
                    <i class="fas fa-utensils"></i>
                </div>
                <h5>Phụ kiện</h5>
                <p class="text-muted small">Dụng cụ pha cà phê</p>
            </div>
        </div>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/onlycoffee/}" class="btn btn-coffee px-4">
            <i class="fas fa-home me-2"></i>Trang chủ
        </a>
    </div>
</div>

</body>
</html>
