<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng | OnlyCoffee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #f8f9fa; }
        .section-title {
            color: #6f4e37;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
        }
        .table thead {
            background-color: #6f4e37;
            color: #fff;
        }
        .btn-coffee {
            background-color: #6f4e37;
            color: white;
        }
        .btn-coffee:hover {
            background-color: #5a3d2b;
            color: white;
        }
        .total-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,.1);
        }
    </style>
</head>
<body>

<div class="container py-5">
    <h2 class="section-title">GIỎ HÀNG CỦA BẠN</h2>

    <div class="table-responsive mb-4">
        <table class="table table-bordered align-middle text-center">
            <thead>
            <tr>
                <th>Sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
                <th>Thành tiền</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>Arabica Đà Lạt Premium</td>
                <td>350.000₫</td>
                <td>1</td>
                <td class="fw-bold text-danger">350.000₫</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="row">
        <div class="col-md-6"></div>
        <div class="col-md-6">
            <div class="total-box text-end">
                <h5>Tổng cộng</h5>
                <p class="fs-4 fw-bold text-danger">350.000₫</p>

                <div class="d-flex justify-content-between mt-3">
                    <a th:href="@{/onlycoffee/products}" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left me-1"></i>Mua tiếp
                    </a>
                    <button class="btn btn-coffee">
                        <i class="fas fa-credit-card me-1"></i>Thanh toán
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
