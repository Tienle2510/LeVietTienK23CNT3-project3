<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <!-- THÊM DÒNG NÀY - QUAN TRỌNG -->
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title layout:title-pattern="$CONTENT_TITLE - OnlyCoffee">OnlyCoffee - Cà phê nguyên chất</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS chung -->
    <link rel="stylesheet" th:href="@{/css/main.css}">

    <style>
        /* CSS chung cho toàn site */
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar-brand {
            font-weight: bold;
            color: #6f4e37 !important;
            font-size: 1.5rem;
        }

        .nav-link {
            color: #555 !important;
            font-weight: 500;
        }

        .nav-link:hover {
            color: #6f4e37 !important;
        }

        .btn-coffee {
            background-color: #6f4e37;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            font-weight: 500;
            transition: background-color 0.3s;
        }

        .btn-coffee:hover {
            background-color: #5a3d2b;
            color: white;
        }

        .btn-outline-coffee {
            color: #6f4e37;
            border-color: #6f4e37;
        }

        .btn-outline-coffee:hover {
            background-color: #6f4e37;
            color: white;
        }

        .coffee-brown {
            color: #6f4e37;
        }

        .bg-coffee {
            background-color: #6f4e37 !important;
        }
    </style>
</head>

<body>
<!-- Navigation -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Banner (sẽ hiện nếu không ẩn) -->
<div layout:fragment="banner">
    <div th:replace="fragments/banner :: banner"></div>
</div>

<!-- Main Content -->
<main layout:fragment="content">
    <!-- Nội dung từng trang -->
</main>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

<!-- Bootstrap JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<script layout:fragment="script">
    // Script chung
</script>
</body>
</html>
