<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base th:href="@{/onlycoffee/}">
    <title>Coming Soon - OnlyCoffee Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .coming-soon-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .coffee-icon {
            font-size: 5rem;
            color: #6f4e37;
            margin-bottom: 2rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="coming-soon-container text-center">
        <div>
            <div class="coffee-icon">
                <i class="fas fa-coffee"></i>
            </div>

            <h1 class="mb-3">Tính năng đang phát triển</h1>

            <p class="lead mb-4" th:text="${message}">
                Chúng tôi đang nỗ lực hoàn thiện tính năng này. Vui lòng quay lại sau!
            </p>

            <div class="mt-4">
                <a href="/onlycoffee/admin/dashboard" class="btn btn-coffee btn-lg">
                    <i class="fas fa-arrow-left"></i> Quay lại Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
