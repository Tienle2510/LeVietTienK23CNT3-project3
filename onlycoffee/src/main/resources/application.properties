# ========== SERVER CONFIGURATION ==========
server.port=8080
server.servlet.context-path=/onlycoffee
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ========== DATABASE CONFIGURATION ==========
spring.datasource.url=jdbc:mysql://localhost:3306/coffee_store_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=root
spring.datasource.password=0965623856
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== JPA CONFIGURATION ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.connection.CharSet=UTF-8
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true

# ========== THYMELEAF CONFIGURATION (QUAN TR?NG) ==========
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.servlet.content-type=text/html;charset=UTF-8

# ========== SPRING ENCODING CONFIGURATION ==========
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
spring.web.resources.encoding.charset=UTF-8
spring.web.resources.encoding.enabled=true

# ========== SPRING SECURITY CONFIGURATION ==========
spring.security.user.name=admin@onlycoffee.vn
spring.security.user.password=123456
spring.security.user.roles=ADMIN

# ========== FILE UPLOAD CONFIGURATION ==========
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads/

# ========== EMAIL CONFIGURATION (Optional) ==========
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=your-email@gmail.com
# spring.mail.password=your-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# ========== JWT CONFIGURATION ==========
jwt.secret=onlycoffeeSecretKeyForJWTAuthentication2024OnlyCoffeeSecret
jwt.expiration=86400000

# ========== LOGGING CONFIGURATION ==========
logging.level.com.onlycoffee=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ========== APPLICATION SETTINGS ==========
app.name=OnlyCoffee
app.version=1.0.0
app.url=http://localhost:8080/onlycoffee